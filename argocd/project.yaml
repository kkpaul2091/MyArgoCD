apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: my-school-apps
  namespace: argocd
spec:
  description: Project for my-school applications
  sourceRepos:
    - 'https://github.com/kkpaul2091/MyArgoCD.git'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'