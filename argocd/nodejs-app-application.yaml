apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-school-app
  namespace: argocd
spec:
  project: my-school-apps
  source:
    repoURL: https://github.com/kkpaul2091/MyArgoCD.git
    targetRevision: HEAD
    path: k8s-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: my-school-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true